# Comms-only controls. With the stock route, Comms = STT channel 0;
# ASR = wake word channel 1. These do not alter ASR or I2S routing.
switch:
  - platform: template
    id: xvf_command_profile
    name: "Comms - Wake command DSP profile"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: xvf_command_echo
    name: "Comms - Disable residual echo during command"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: xvf_command_nl
    name: "Comms - Disable nonlinear echo during command"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    id: pp_echo_on
    name: "Comms - Residual echo suppression"
    entity_category: config
    restore_mode: DISABLED
    optimistic: false
    turn_on_action:
      - lambda: |-
          if (!id(respeaker).command_profile_active()) id(respeaker).write_pp<int32_t>(23, 1);
    turn_off_action:
      - lambda: |-
          if (!id(respeaker).command_profile_active()) id(respeaker).write_pp<int32_t>(23, 0);
  - platform: template
    id: pp_nl_atten_on
    name: "Comms - Nonlinear echo attenuation"
    entity_category: config
    restore_mode: DISABLED
    optimistic: false
    turn_on_action:
      - lambda: |-
          if (!id(respeaker).command_profile_active()) id(respeaker).write_pp<int32_t>(27, 1);
    turn_off_action:
      - lambda: |-
          if (!id(respeaker).command_profile_active()) id(respeaker).write_pp<int32_t>(27, 0);
  - platform: template
    id: pp_agc_on
    name: "Comms - Automatic gain control"
    entity_category: config
    restore_mode: DISABLED
    optimistic: false
    turn_on_action:
      - lambda: |-
          if (!id(respeaker).command_profile_active()) id(respeaker).write_pp<int32_t>(10, 1);
    turn_off_action:
      - lambda: |-
          if (!id(respeaker).command_profile_active()) id(respeaker).write_pp<int32_t>(10, 0);

number:
  - platform: template
    id: pp_min_ns
    name: "Comms - Stationary noise gain floor"
    entity_category: config
    min_value: 0
    max_value: 1
    step: 0.01
    mode: slider
    update_interval: 10s
    lambda: |-
      float value;
      if (id(respeaker).command_profile_active() || !id(respeaker).read_pp(21, value)) return {};
      return value;
    set_action:
      - lambda: |-
          if (!id(respeaker).command_profile_active()) id(respeaker).write_pp<float>(21, x);
  - platform: template
    id: pp_min_nn
    name: "Comms - Nonstationary noise gain floor"
    entity_category: config
    min_value: 0
    max_value: 1
    step: 0.01
    mode: slider
